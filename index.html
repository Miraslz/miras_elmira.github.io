<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мирас & Эльмира — Приглашение на свадьбу</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a059;
            --primary-dark: #a37f3f;
            --bg-color: #fcfbfa;
            --text-color: #2c2c2c;
            --gold-light: #f4ebd0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Language Switcher */
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--primary);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }

        .lang-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* Section styles */
        section {
            padding: 40px 0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }

        section:last-child {
            border-bottom: none;
        }

        /* Hero Image - Hands with Rings */
        .hero-img-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary);
            box-shadow: 0 8px 25px rgba(197, 160, 89, 0.3);
            padding: 5px;
            background: #fff;
        }

        .hero-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Typography */
        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .script-text {
            font-family: 'Great Vibes', cursive;
            font-size: 46px;
            color: var(--primary);
            line-height: 1.2;
            margin: 10px 0;
        }
